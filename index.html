<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Dan's CASHino Video Poker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0213">

    <style>
        /* GLITZ & GLAMOUR THEME */
        :root {
            --bg-color: #0b0213;
            --gold: #ffcf40;
            --gold-glow: 0 0 10px rgba(255, 207, 64, 0.6), 0 0 20px rgba(255, 207, 64, 0.3);
            --neon-green: #39ff14;
            --neon-pink: #ff00ff;
            --panel-bg: rgba(20, 10, 30, 0.85);
            --text-main: #f8fafc;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at top, rgba(116, 27, 219, 0.3) 0%, transparent 40%),
                linear-gradient(45deg, #11041d 25%, transparent 25%, transparent 75%, #11041d 75%, #11041d), 
                linear-gradient(45deg, #11041d 25%, transparent 25%, transparent 75%, #11041d 75%, #11041d);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            background-position: 0 0, 0 0, 10px 10px;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
            touch-action: manipulation;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Dan's CASHino Title */
        .neon-title {
            text-align: center;
            font-size: clamp(24px, 6vw, 32px);
            font-weight: 900;
            font-style: italic;
            color: #fff;
            margin: 5px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 
                0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-pink), 
                0 0 40px var(--neon-pink), 0 0 80px var(--neon-pink);
            animation: flicker 4s infinite alternate;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink); opacity: 1; }
            20%, 24%, 55% { text-shadow: none; opacity: 0.8; }
        }

        /* Header / Bankroll */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--panel-bg);
            border: 1px solid var(--neon-pink);
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }
        .balance { font-size: clamp(20px, 5vw, 24px); font-weight: 900; color: var(--neon-green); text-shadow: 0 0 8px rgba(57, 255, 20, 0.5); }
        .net-tracker { font-size: 12px; color: #cbd5e1; font-weight: bold; }
        .add-money-btn {
            background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
            color: #000;
            border: 1px solid #fef08a;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        /* Paytable */
        .paytable-container {
            background-color: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--gold);
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: var(--gold-glow);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: clamp(9px, 2.5vw, 13px);
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
        }
        th, td { padding: 3px 5px; border-bottom: 1px solid #333; }
        th { background-color: #111; color: var(--gold); text-align: center; cursor: pointer; padding: 5px; }
        td:first-child { text-align: left; color: #fff; width: 35%; }
        
        .col-active { background-color: rgba(255, 207, 64, 0.2) !important; color: var(--gold); }
        th.col-active { background-color: var(--gold) !important; color: #000; text-shadow: none; }
        .row-winner { background-color: rgba(57, 255, 20, 0.3) !important; border: 1px solid var(--neon-green); animation: pulse-win 1s infinite; }
        
        @keyframes pulse-win {
            0% { background-color: rgba(57, 255, 20, 0.2); }
            50% { background-color: rgba(57, 255, 20, 0.5); text-shadow: 0 0 5px #000; }
            100% { background-color: rgba(57, 255, 20, 0.2); }
        }

        /* Trainer / Bet Info */
        .trainer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            background-color: var(--panel-bg);
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #4c1d95;
            color: var(--gold);
            font-weight: bold;
        }
        .bet-display { color: white; background: #000; padding: 3px 6px; border-radius: 4px; border: 1px solid #333;}
        .trainer-toggle { width: 18px; height: 18px; accent-color: var(--neon-green); }

        /* Card Stage & 3D Flip Animations */
        .card-stage {
            display: flex;
            justify-content: space-between;
            flex-grow: 1;
            align-items: center;
            gap: 4px;
            padding: 5px 0;
            perspective: 1000px;
        }
        
        .card-container {
            flex: 1;
            aspect-ratio: 2.5 / 3.5;
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        
        .card-inner.face-down { transform: rotateY(180deg); }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 6px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card-back {
            background: repeating-linear-gradient(45deg, #b91c1c, #b91c1c 8px, #991b1b 8px, #991b1b 16px);
            border: 3px solid #fff;
            transform: rotateY(180deg);
        }
        
        .card-front {
            background: #fff;
            color: #000;
            font-size: clamp(20px, 5vw, 32px);
            font-weight: 900;
            border: 2px solid #ccc;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 2px 4px 10px rgba(0,0,0,0.8);
        }

        .card-front.red { color: #dc2626; }
        
        .card-rank-top { position: absolute; top: 4px; left: 4px; font-size: clamp(12px, 3vw, 16px); line-height: 1; }
        .card-rank-bottom { position: absolute; bottom: 4px; right: 4px; font-size: clamp(12px, 3vw, 16px); line-height: 1; transform: rotate(180deg); }
        .card-center-suit { font-size: clamp(30px, 8vw, 48px); }

        .card-container.held .card-inner { transform: translateY(-12px); }
        .card-container.held .card-inner.face-down { transform: translateY(-12px) rotateY(180deg); }
        
        .card-container.held .card-front {
            border: 3px solid var(--neon-pink);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 0 15px rgba(255, 0, 255, 0.8);
        }

        .held-badge {
            position: absolute;
            top: -10px;
            background: var(--neon-pink);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            display: none;
            font-weight: 900;
            letter-spacing: 1px;
            z-index: 10;
            box-shadow: 0 0 5px #000;
        }
        .card-container.held .held-badge { display: block; }

        /* Controls */
        .control-panel { padding-bottom: 5px; display: flex; flex-direction: column; gap: 8px; }
        .message-area { text-align: center; font-size: clamp(16px, 4vw, 20px); height: 24px; color: var(--gold); font-weight: 900; text-shadow: 1px 1px 2px #000; }
        
        .big-btn {
            background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%);
            color: #fff;
            border: 2px solid #fca5a5;
            padding: 18px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 6px 0 #7f1d1d, 0 10px 15px rgba(0,0,0,0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .big-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #7f1d1d; }
        
        .btn-winner {
            background: linear-gradient(180deg, var(--neon-green) 0%, #166534 100%) !important;
            border: 2px solid #86efac !important;
            box-shadow: 0 6px 0 #14532d, 0 0 20px rgba(57, 255, 20, 0.6) !important;
            color: #000 !important;
            animation: pulse-btn 1.5s infinite;
        }
        @keyframes pulse-btn {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
            100% { filter: brightness(1); }
        }

        .hint-btn {
            background: linear-gradient(180deg, #a855f7 0%, #6b21a8 100%);
            color: white;
            border: 1px solid #d8b4fe;
            padding: 12px;
            font-size: 14px;
            font-weight: 900;
            border-radius: 8px;
            display: none; 
            cursor: pointer;
            box-shadow: 0 4px 0 #4c1d95;
        }

        /* Win Popup Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(5px);
        }
        .win-box {
            background: linear-gradient(135deg, #1e1b2e 0%, #0d0914 100%);
            border: 4px solid var(--neon-green);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.5), inset 0 0 20px rgba(57, 255, 20, 0.2);
            animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop-in { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .win-title { color: var(--gold); font-size: 32px; margin: 0 0 10px 0; text-transform: uppercase; text-shadow: 0 0 10px var(--gold); }
        .win-amount { color: var(--neon-green); font-size: 48px; margin: 0; font-weight: 900; text-shadow: 0 0 15px rgba(57, 255, 20, 0.8); }
        .win-tap { color: #94a3b8; font-size: 14px; margin-top: 20px; font-weight: bold; }

    </style>
</head>
<body>

    <div class="neon-title">Dan's CASHino</div>

    <div class="header">
        <div>
            <div class="balance" id="balanceDisplay">$100.00</div>
            <div class="net-tracker" id="netDisplay">Net: $0.00</div>
        </div>
        <button class="add-money-btn" onclick="addMoney()">+ $100</button>
    </div>

    <div class="paytable-container">
        <table id="paytable">
            <thead>
                <tr>
                    <th>HAND</th>
                    <th onclick="setBetLevel(1)" id="col-1">1</th>
                    <th onclick="setBetLevel(2)" id="col-2">2</th>
                    <th onclick="setBetLevel(3)" id="col-3">3</th>
                    <th onclick="setBetLevel(4)" id="col-4">4</th>
                    <th onclick="setBetLevel(5)" id="col-5">5</th>
                </tr>
            </thead>
            <tbody id="paytable-body"></tbody>
        </table>
    </div>

    <div class="trainer-bar">
        <div>BET: <span class="bet-display" id="betDisplay">$1.25</span></div>
        <div>
            <label for="trainerToggle" style="margin-right: 5px;">TRAINER</label>
            <input type="checkbox" id="trainerToggle" class="trainer-toggle" checked>
        </div>
    </div>

    <div class="card-stage" id="cardStage"></div>

    <div class="control-panel">
        <div class="message-area" id="messageArea">TAP PAYTABLE TO SET BET</div>
        <button class="hint-btn" id="hintBtn" onclick="showHint()">INCORRECT! Tap for Perfect Play</button>
        <button class="big-btn" id="mainBtn" onclick="handleMainAction()">DEAL</button>
    </div>

    <div class="modal-overlay" id="winModal" onclick="closePopup()">
        <div class="win-box">
            <h1 class="win-title" id="winHandName">ROYAL FLUSH</h1>
            <h2 class="win-amount" id="winAmountValue">$1,000.00</h2>
            <div class="win-tap">TAP TO COLLECT</div>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        // These look for files named deal.mp3 and win.mp3 in the same folder
        const dealSound = new Audio('deal.mp3');
        const winSound = new Audio('win.mp3');
        
        // --- GAME STATE ---
        let balance = 100.00;
        let net = 0.00;
        let betCredits = 5; 
        const creditValue = 0.25; 
        
        let gameState = 'idle'; 
        let deck = [];
        let hand = [];
        let holds = [false, false, false, false, false];
        let hintShown = false;
        let optimalHintMask = [];
        let preDrawWin = false;
        let isAnimating = false; 
        
        const suits = ['♠', '♥', '♦', '♣'];
        const values = [
            {str: '2', rank: 2}, {str: '3', rank: 3}, {str: '4', rank: 4}, {str: '5', rank: 5},
            {str: '6', rank: 6}, {str: '7', rank: 7}, {str: '8', rank: 8}, {str: '9', rank: 9},
            {str: '10', rank: 10}, {str: 'J', rank: 11}, {str: 'Q', rank: 12}, {str: 'K', rank: 13}, {str: 'A', rank: 14}
        ];

        const PAYOUTS = [
            { id: "rf", name: "Royal Flush", pays: [250, 500, 750, 1000, 4000] },
            { id: "sf", name: "Straight Flush", pays: [50, 100, 150, 200, 250] },
            { id: "4k", name: "4 of a Kind", pays: [25, 50, 75, 100, 125] },
            { id: "fh", name: "Full House", pays: [9, 18, 27, 36, 45] },
            { id: "fl", name: "Flush", pays: [6, 12, 18, 24, 30] },
            { id: "st", name: "Straight", pays: [4, 8, 12, 16, 20] },
            { id: "3k", name: "3 of a Kind", pays: [3, 6, 9, 12, 15] },
            { id: "2p", name: "Two Pair", pays: [2, 4, 6, 8, 10] },
            { id: "jb", name: "Jacks or Better", pays: [1, 2, 3, 4, 5] }
        ];

        const uiStage = document.getElementById('cardStage');
        const uiBalance = document.getElementById('balanceDisplay');
        const uiNet = document.getElementById('netDisplay');
        const uiMessage = document.getElementById('messageArea');
        const uiMainBtn = document.getElementById('mainBtn');
        const uiHintBtn = document.getElementById('hintBtn');
        const uiBetDisplay = document.getElementById('betDisplay');
        const uiPaytableBody = document.getElementById('paytable-body');
        const uiModal = document.getElementById('winModal');

        // --- INITIALIZATION ---
        function initApp() {
            renderPaytable();
            setBetLevel(5); 
            uiStage.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                let cardContainer = document.createElement('div');
                cardContainer.className = 'card-container';
                cardContainer.id = `card-container-${i}`;
                cardContainer.onclick = () => toggleHold(i);
                
                cardContainer.innerHTML = `
                    <span class="held-badge">HELD</span>
                    <div class="card-inner face-down" id="card-inner-${i}">
                        <div class="card-back"></div>
                        <div class="card-front" id="card-front-${i}"></div>
                    </div>
                `;
                uiStage.appendChild(cardContainer);
            }
            updateBankroll();
        }

        function renderPaytable() {
            uiPaytableBody.innerHTML = '';
            PAYOUTS.forEach(row => {
                let tr = document.createElement('tr');
                tr.id = `row-${row.id}`;
                let html = `<td>${row.name}</td>`;
                for(let i=0; i<5; i++) {
                    html += `<td class="col-pay-${i+1}">${row.pays[i]}</td>`;
                }
                tr.innerHTML = html;
                uiPaytableBody.appendChild(tr);
            });
        }

        function setBetLevel(credits) {
            if (gameState === 'dealt' || isAnimating) return; 
            betCredits = credits;
            uiBetDisplay.innerText = `$${(betCredits * creditValue).toFixed(2)}`;
            uiMainBtn.innerText = `DEAL ($${(betCredits * creditValue).toFixed(2)})`;
            
            for(let i=1; i<=5; i++) {
                document.getElementById(`col-${i}`).classList.remove('col-active');
                document.querySelectorAll(`.col-pay-${i}`).forEach(td => td.classList.remove('col-active'));
            }
            document.getElementById(`col-${betCredits}`).classList.add('col-active');
            document.querySelectorAll(`.col-pay-${betCredits}`).forEach(td => td.classList.add('col-active'));
        }

        function clearTableHighlights() {
            PAYOUTS.forEach(row => document.getElementById(`row-${row.id}`).classList.remove('row-winner'));
        }

        function updateBankroll() {
            uiBalance.innerText = `$${balance.toFixed(2)}`;
            uiNet.innerText = `Net: ${net >= 0 ? '+' : '-'} $${Math.abs(net).toFixed(2)}`;
            if (net < 0) uiNet.style.color = '#ef4444';
            else uiNet.style.color = 'var(--neon-green)';
        }

        function buildDeck() {
            deck = [];
            for (let s of suits) {
                for (let v of values) {
                    deck.push({ suit: s, str: v.str, rank: v.rank, isRed: s === '♥' || s === '♦' });
                }
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function handleMainAction() {
            if (isAnimating) return;
            if (gameState === 'idle' || gameState === 'gameover') {
                dealHand();
            } else if (gameState === 'dealt') {
                drawCards();
            }
        }

        function dealHand() {
            let cost = betCredits * creditValue;
            if (balance < cost) {
                uiMessage.innerText = "ADD FUNDS TO PLAY";
                uiMessage.style.color = "#ef4444";
                return;
            }
            
            // PLAY DEAL SOUND
            dealSound.cloneNode(true).play().catch(e => console.log("Audio play prevented"));

            isAnimating = true;
            balance -= cost;
            net -= cost;
            updateBankroll();
            clearTableHighlights();
            
            buildDeck();
            hand = deck.splice(0, 5);
            holds = [false, false, false, false, false];
            hintShown = false;
            preDrawWin = false;
            
            uiHintBtn.style.display = 'none';
            uiMessage.innerText = "DEALING...";
            uiMessage.style.color = "#fff";
            uiMainBtn.className = "big-btn"; 
            
            for(let i=0; i<5; i++) {
                document.getElementById(`card-container-${i}`).classList.remove('held');
                document.getElementById(`card-inner-${i}`).classList.add('face-down');
            }

            setTimeout(() => {
                applyCardValuesToDOM();
                for(let i=0; i<5; i++) {
                    document.getElementById(`card-inner-${i}`).classList.remove('face-down');
                }
                
                setTimeout(() => {
                    gameState = 'dealt';
                    uiMainBtn.innerText = "DRAW";
                    uiMessage.innerText = "CHOOSE CARDS TO HOLD";
                    uiMessage.style.color = "var(--gold)";
                    
                    let dealtEval = evaluatePokerHand(hand);
                    if (dealtEval) {
                        preDrawWin = true;
                        uiMainBtn.classList.add('btn-winner');
                        uiMainBtn.innerText = "DRAW (WINNER DEALT!)";
                        uiMessage.innerText = dealtEval.name.toUpperCase() + " DEALT!";
                        uiMessage.style.color = "var(--neon-green)";
                    }
                    isAnimating = false;
                }, 400); 
            }, 300); 
        }

        function toggleHold(index) {
            if (gameState !== 'dealt' || isAnimating) return;
            holds[index] = !holds[index];
            let container = document.getElementById(`card-container-${index}`);
            if (holds[index]) container.classList.add('held');
            else container.classList.remove('held');
        }

        function drawCards() {
            const trainerActive = document.getElementById('trainerToggle').checked;
            optimalHintMask = getOptimalHoldMask();
            let isPerfect = holds.every((val, i) => val === optimalHintMask[i]);
            
            if (trainerActive && !isPerfect && !hintShown) {
                uiHintBtn.style.display = 'block';
                uiMainBtn.className = "big-btn"; 
                uiMessage.innerText = "";
                return; 
            }

            // PLAY DRAW SOUND
            dealSound.cloneNode(true).play().catch(e => console.log("Audio play prevented"));

            isAnimating = true;
            uiMessage.innerText = "DRAWING...";
            uiHintBtn.style.display = 'none';
            uiMainBtn.className = "big-btn";

            let cardsToDraw = 0;
            for (let i = 0; i < 5; i++) {
                if (!holds[i]) {
                    document.getElementById(`card-inner-${i}`).classList.add('face-down');
                    cardsToDraw++;
                }
            }

            let delay = cardsToDraw > 0 ? 300 : 0;

            setTimeout(() => {
                for (let i = 0; i < 5; i++) {
                    if (!holds[i]) hand[i] = deck.pop();
                }
                
                applyCardValuesToDOM();

                for (let i = 0; i < 5; i++) {
                    if (!holds[i]) {
                        document.getElementById(`card-inner-${i}`).classList.remove('face-down');
                    }
                }

                setTimeout(() => {
                    evaluateAndPayout();
                    isAnimating = false;
                }, delay > 0 ? 400 : 0);

            }, delay);
        }

        function applyCardValuesToDOM() {
            for (let i = 0; i < 5; i++) {
                let c = hand[i];
                let front = document.getElementById(`card-front-${i}`);
                if (c) {
                    front.className = `card-front ${c.isRed ? 'red' : ''}`;
                    front.innerHTML = `
                        <div class="card-rank-top">${c.str}<br>${c.suit}</div>
                        <div class="card-center-suit">${c.suit}</div>
                        <div class="card-rank-bottom">${c.str}<br>${c.suit}</div>
                    `;
                }
            }
        }

        function showHint() {
            hintShown = true;
            holds = [...optimalHintMask];
            for (let i = 0; i < 5; i++) {
                let container = document.getElementById(`card-container-${i}`);
                if (holds[i]) container.classList.add('held');
                else container.classList.remove('held');
            }
            uiHintBtn.style.display = 'none';
            uiMessage.innerText = "PERFECT PLAY APPLIED";
            uiMessage.style.color = "var(--gold)";
            if (preDrawWin) uiMainBtn.classList.add('btn-winner');
        }

        function evaluateAndPayout() {
            let result = evaluatePokerHand(hand);
            
            if (result) {
                let coinsWon = result.pays[betCredits - 1];
                let cashWon = coinsWon * creditValue;
                
                balance += cashWon;
                net += cashWon;
                
                document.getElementById(`row-${result.id}`).classList.add('row-winner');
                uiMessage.innerText = `WINNER: $${cashWon.toFixed(2)}`;
                uiMessage.style.color = "var(--neon-green)";
                
                // PLAY WIN SOUND
                winSound.cloneNode(true).play().catch(e => console.log("Audio play prevented"));
                
                showPopup(result.name, cashWon);
            } else {
                uiMessage.innerText = "GAME OVER";
                uiMessage.style.color = "#cbd5e1";
            }
            
            updateBankroll();
            gameState = 'gameover';
            uiMainBtn.innerText = `DEAL ($${(betCredits * creditValue).toFixed(2)})`;
        }

        function showPopup(name, amount) {
            document.getElementById('winHandName').innerText = name;
            document.getElementById('winAmountValue').innerText = `+$${amount.toFixed(2)}`;
            uiModal.style.display = 'flex';
            setTimeout(() => { closePopup(); }, 2500);
        }

        function closePopup() {
            uiModal.style.display = 'none';
        }

        function evaluatePokerHand(cards) {
            let sortedRanks = cards.map(c => c.rank).sort((a,b) => a-b);
            let isFlush = cards.every(c => c.suit === cards[0].suit);
            
            let isStraight = false;
            if (sortedRanks[0] + 4 === sortedRanks[4] && new Set(sortedRanks).size === 5) {
                isStraight = true;
            } else if (sortedRanks[0] === 2 && sortedRanks[1] === 3 && sortedRanks[2] === 4 && sortedRanks[3] === 5 && sortedRanks[4] === 14) {
                isStraight = true;
                sortedRanks = [2, 3, 4, 5, 14];
            }

            let counts = {};
            for (let r of sortedRanks) counts[r] = (counts[r] || 0) + 1;
            let freq = Object.values(counts).sort((a,b) => b-a);

            if (isFlush && isStraight) {
                if (sortedRanks[4] === 14 && sortedRanks[3] === 13) return PAYOUTS.find(p => p.id === "rf");
                return PAYOUTS.find(p => p.id === "sf");
            }
            if (freq[0] === 4) return PAYOUTS.find(p => p.id === "4k");
            if (freq[0] === 3 && freq[1] === 2) return PAYOUTS.find(p => p.id === "fh");
            if (isFlush) return PAYOUTS.find(p => p.id === "fl");
            if (isStraight) return PAYOUTS.find(p => p.id === "st");
            if (freq[0] === 3) return PAYOUTS.find(p => p.id === "3k");
            if (freq[0] === 2 && freq[1] === 2) return PAYOUTS.find(p => p.id === "2p");
            if (freq[0] === 2) {
                let pairRank = parseInt(Object.keys(counts).find(k => counts[k] === 2));
                if (pairRank >= 11) return PAYOUTS.find(p => p.id === "jb");
            }
            return null; 
        }

        function getOptimalHoldMask() {
            let possibleHolds = [];
            for (let i = 0; i < 32; i++) {
                let mask = [(i&1)>0, (i&2)>0, (i&4)>0, (i&8)>0, (i&16)>0];
                let subHand = hand.filter((_, idx) => mask[idx]);
                let score = rankSubset(subHand);
                possibleHolds.push({ mask, score });
            }
            possibleHolds.sort((a, b) => b.score - a.score);
            return possibleHolds[0].mask;
        }

        function rankSubset(sub) {
            let len = sub.length;
            if (len === 0) return 1; 
            let ranks = sub.map(c => c.rank).sort((a,b) => a-b);
            let isSuited = sub.every(c => c.suit === sub[0].suit);
            let highCards = sub.filter(c => c.rank >= 11).length;
            let isStraight = (len === 5 && ranks[4]-ranks[0]===4 && new Set(ranks).size===5) || 
                             (len === 5 && ranks[0]===2 && ranks[1]===3 && ranks[2]===4 && ranks[3]===5 && ranks[4]===14);
            let counts = {};
            for (let r of ranks) counts[r] = (counts[r] || 0) + 1;
            let freq = Object.values(counts).sort((a,b) => b-a);

            if (len === 5) {
                if (isSuited && isStraight && ranks[4]===14 && ranks[3]===13) return 160; 
                if (isSuited && isStraight) return 150; 
                if (freq[0] === 4) return 140; 
                if (freq[0] === 3 && freq[1] === 2) return 130; 
                if (isSuited) return 120; 
                if (isStraight) return 110; 
            }
            if (len === 4) {
                if (isSuited && sub.every(c => c.rank >= 10)) return 155; 
                if (isSuited && (ranks[3]-ranks[0]<=4 || (ranks[3]===14 && ranks[2]<=5))) return 115; 
                if (freq[0] === 2 && freq[1] === 2) return 105; 
                if (isSuited) return 90; 
                if (freq[0] === 1 && ranks[3]-ranks[0]===3) return 70; 
            }
            if (len === 3) {
                if (freq[0] === 3) return 135; 
                if (isSuited && sub.every(c => c.rank >= 10)) return 100; 
                if (isSuited && (ranks[2]-ranks[0]<=4 || (ranks[2]===14 && ranks[1]<=5))) return 50; 
            }
            if (len === 2) {
                if (freq[0] === 2) return ranks[0] >= 11 ? 110 : 80; 
                if (isSuited && highCards === 2) return 60; 
                if (highCards === 2) return 40; 
                if (isSuited && ranks[1] >= 11 && ranks[0] === 10) return 30; 
            }
            if (len === 1) {
                if (highCards === 1) return 20; 
            }
            return 1;
        }

        function addMoney() {
            balance += 100;
            updateBankroll();
        }

        initApp();
    </script>
